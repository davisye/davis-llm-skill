name: Validate Skill Catalog

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Validate canonical skill metadata and source records
        run: uv run --script scripts/check_skill_catalog.py --source-only
      - name: Check shell syntax
        run: bash -n scripts/*.sh
